<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX Export Test</title>
    <!-- 1. Include Libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 50px;
            text-align: center;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #00a651;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #008542;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>DOCX Export Test</h1>
        <p>Click the button below to test client-side DOCX generation.</p>
        <button onclick="testExport()">Generate & Download .docx</button>
        <div id="status" class="status">Waiting for user...</div>
    </div>

    <script>
        async function testExport() {
            const status = document.getElementById('status');
            status.innerText = "Initializing generation...";
            status.style.color = "blue";

            try {
                // 2. Runtime Safety Check
                const docxLib = window.docx || window.DOCX;
                if (!docxLib || !docxLib.Document) {
                    throw new Error("Document library (docx.js) not loaded. Please ensure you are online.");
                }

                const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType } = docxLib;

                // 3. Create Document Structure
                const doc = new Document({
                    sections: [{
                        children: [
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "Hello from Bio-Table Maker!", bold: true, size: 48, color: "00a651" })
                                ]
                            }),
                            new Paragraph({ text: "This is a test document generated entirely in the browser.", spacing: { before: 200 } }),
                            new Table({
                                width: { size: 100, type: WidthType.PERCENTAGE },
                                rows: [
                                    new TableRow({
                                        children: [
                                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Feature", bold: true })] })] }),
                                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Status", bold: true })] })] }),
                                        ]
                                    }),
                                    new TableRow({
                                        children: [
                                            new TableCell({ children: [new Paragraph({ text: "Client-Side Generation" })] }),
                                            new TableCell({ children: [new Paragraph({ text: "Working" })] }),
                                        ]
                                    }),
                                    new TableRow({
                                        children: [
                                            new TableCell({ children: [new Paragraph({ text: "Offline Compatibility" })] }),
                                            new TableCell({ children: [new Paragraph({ text: "Ready (with local files)" })] }),
                                        ]
                                    })
                                ]
                            })
                        ]
                    }]
                });

                // 4. Generate Blob
                const blob = await Packer.toBlob(doc);

                // 5. Download using FileSaver.js or Fallback
                const fileName = "BioTable_Test_Report.docx";
                if (typeof saveAs !== 'undefined') {
                    saveAs(blob, fileName);
                } else {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }

                status.innerText = "Download triggered successfully!";
                status.style.color = "green";

            } catch (err) {
                console.error(err);
                status.innerText = "Error: " + err.message;
                status.style.color = "red";
                alert("Failed to generate DOCX: " + err.message);
            }
        }
    </script>
</body>

</html>
